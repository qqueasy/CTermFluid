name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev pkg-config
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ncurses pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix ncurses)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build
        run: make CC=${{ matrix.compiler }}

  dist:
    name: Source distribution
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: make dist
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ctermfluid-source
          path: ctermfluid-*.tar.gz
          if-no-files-found: error
